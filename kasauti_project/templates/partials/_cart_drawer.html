{# Shared cart drawer. Driven by product.js via the server cart API. #}
<div class="cart-drawer" id="cartDrawer" aria-hidden="true">
    <div class="drawer-backdrop" id="cartBackdrop"></div>
    <div class="drawer-panel" role="dialog" aria-modal="true" aria-label="Shopping cart">
        <div class="drawer-header">
            <div class="drawer-title">
                <i class="fa-solid fa-cart-shopping"></i>
                Your Cart
            </div>
            <button class="icon-btn" id="btnCloseCart" type="button" aria-label="Close cart">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <div class="drawer-body">
            <div class="cart-empty" id="cartEmpty">
                Cart is empty. Add something awesome.
            </div>
            <div class="cart-items" id="cartItems"></div>
        </div>

        <div class="drawer-footer">
            <div class="totals">
                <div class="row">
                    <span>Subtotal</span>
                    <span id="cartSubtotal">₹0</span>
                </div>
                <div class="row muted">
                    <span>GST (18%)</span>
                    <span id="cartTax">₹0</span>
                </div>
                <div class="row total">
                    <span>Total</span>
                    <span id="cartTotal">₹0</span>
                </div>
            </div>

            <button class="btn primary w-100" id="btnCheckout" type="button">
                <i class="fa-solid fa-credit-card"></i>
                Checkout
            </button>

            <div class="note">Secure checkout • GST included • Pan-India dispatch.</div>
        </div>
    </div>
</div>
