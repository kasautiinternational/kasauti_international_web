{% extends 'base.html' %}
{% block content %}
{% load static %}

<style>
  /* ── Logout confirmation (fallback page) — Kasauti theme ── */
  .logout-confirm-section {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 140px 20px 60px;
    font-family: "Poppins", sans-serif;
    background:
      radial-gradient(900px 500px at 10% 0%, rgba(6, 182, 212, .06), transparent 55%),
      radial-gradient(800px 460px at 90% 10%, rgba(224, 82, 156, .06), transparent 55%),
      radial-gradient(700px 500px at 50% 100%, rgba(234, 179, 8, .05), transparent 55%),
      #faf9f6;
  }

  .logout-card {
    position: relative;
    width: 100%;
    max-width: 460px;
    background: #ffffff;
    border: 1px solid rgba(201, 151, 63, 0.18);
    border-radius: 24px;
    box-shadow: 0 30px 90px rgba(15, 23, 42, 0.12);
    padding: 44px 36px 36px;
    text-align: center;
    overflow: hidden;
  }

  .logout-card::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 5px;
    background: linear-gradient(90deg,
      var(--ink-cyan, #06b6d4) 0 25%,
      var(--ink-magenta, #e0529c) 25% 50%,
      #eab308 50% 75%,
      #7c3aed 75% 100%);
  }

  .logout-icon {
    width: 74px;
    height: 74px;
    margin: 0 auto 18px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, rgba(201, 151, 63, 0.14), rgba(245, 208, 138, 0.20));
    border: 1.5px solid rgba(201, 151, 63, 0.35);
  }
  .logout-icon i {
    font-size: 30px;
    color: #c9973f;
  }

  .logout-card h1 {
    font-size: 26px;
    font-weight: 800;
    color: #0f172a;
    margin: 0 0 10px;
  }
  .logout-card p {
    font-size: 14.5px;
    color: #475569;
    margin: 0 0 6px;
    line-height: 1.6;
  }
  .logout-card .logout-user {
    color: #8a6a23;
    font-weight: 600;
  }

  .logout-actions {
    display: flex;
    gap: 14px;
    margin-top: 28px;
  }
  .logout-actions .btn-cancel,
  .logout-actions .btn-do-logout {
    flex: 1;
    height: 48px;
    border-radius: 8px;
    font-size: 15.5px;
    font-weight: 600;
    font-family: "Poppins", sans-serif;
    cursor: pointer;
    transition: 0.3s ease;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    text-decoration: none;
  }
  .logout-actions .btn-cancel {
    background: #faf9f6;
    border: 1.5px solid rgba(15, 23, 42, 0.12);
    color: #0f172a;
  }
  .logout-actions .btn-cancel:hover {
    border-color: rgba(6, 182, 212, 0.45);
    background: rgba(6, 182, 212, 0.06);
    color: #0e7490;
    transform: translateY(-1px);
  }
  .logout-actions .btn-do-logout {
    background: linear-gradient(135deg, #c9973f, #f5d08a);
    border: none;
    color: #ffffff;
    box-shadow: 0 10px 26px rgba(201, 151, 63, 0.28);
  }
  .logout-actions .btn-do-logout:hover {
    transform: translateY(-1px) scale(1.02);
    box-shadow: 0 14px 32px rgba(201, 151, 63, 0.35);
  }

  @media (prefers-reduced-motion: reduce) {
    .logout-actions .btn-cancel:hover,
    .logout-actions .btn-do-logout:hover { transform: none; }
  }
  @media screen and (max-width: 420px) {
    .logout-card { padding: 36px 22px 28px; }
    .logout-actions { flex-direction: column; }
  }
</style>

<div class="logout-confirm-section">
  <div class="logout-card">
    <div class="logout-icon"><i class="fa-solid fa-right-from-bracket"></i></div>

    <h1>Confirm Logout</h1>
    <p>
      Kya aap sure hain, <span class="logout-user">{{ request.user.get_full_name|default:request.user.username }}</span>?
    </p>
    <p>Aap apne account se logout ho jayenge.</p>

    <div class="logout-actions">
      <a href="{% url 'profile' %}" class="btn-cancel">
        <i class="fa-solid fa-arrow-left"></i> Cancel
      </a>

      <form method="post" action="{% url 'logout' %}" style="flex:1; margin:0;">
        {% csrf_token %}
        <button type="submit" class="btn-do-logout" style="width:100%;">
          <i class="fa-solid fa-right-from-bracket"></i> Yes, Logout
        </button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
