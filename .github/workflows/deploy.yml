name: Auto Deploy Django to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            cd /var/www/kasauti_international_web

            git fetch origin
            git reset --hard origin/main

            cd kasauti_project

            # Agar venv nahi hai to fresh Linux venv banao (self-healing)
            if [ ! -f venv/bin/activate ]; then
              python3 -m venv venv
            fi

            source venv/bin/activate
            pip install -r requirements.txt
            python manage.py migrate --noinput
            python manage.py collectstatic --noinput

            sudo systemctl restart gunicorn
            sudo systemctl reload nginx

            # Health check - agar gunicorn nahi chala to Action RED hoga
            sleep 3
            systemctl is-active --quiet gunicorn || (echo "GUNICORN START FAIL!" && journalctl -u gunicorn -n 20 --no-pager && exit 1)